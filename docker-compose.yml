services:
  adviser-node:
    build:
      context: ./adviser
      dockerfile: Dockerfile
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=ojt_app
      - MYSQL_PASSWORD=ojt_app_password
      - MYSQL_DATABASE=ojt
      - PORT=8080
      - SESSION_SECRET=change_in_prod
    depends_on:
      database:
        condition: service_healthy

  database:
    build:
      context: ./db
      dockerfile: Dockerfile
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=ojt
      - MYSQL_USER=ojt_app
      - MYSQL_PASSWORD=ojt_app_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  student-php:
    build:
      context: ./student
      dockerfile: Dockerfile
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=ojt_app
      - MYSQL_PASSWORD=ojt_app_password
      - MYSQL_DATABASE=ojt
    depends_on:
      database:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - adviser-node
      - student-php
      
volumes:
  db_data: