services:
  adviser-node:
    build:
      context: ./adviser
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_TEST_DATABASE=ojt_test
      - PORT=8080
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=Asia/Manila
      - OIDC_DISCOVERY_URL=http://sso:8080/realms/slu/.well-known/openid-configuration
      - OIDC_CLIENT_ID=ojt-portal
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=http://localhost:8080/adviser/sso/callback
      - OIDC_ALLOW_HTTP=true
      - OIDC_LOGOUT_REDIRECT_URI=http://localhost:8080/adviser/login
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - student_uploads:/var/www/uploads:ro
      - announcement_files:/var/www/announcement-files

  database:
    image: mysql:8.0.46
    restart: unless-stopped
    # query statistics we never read; turning them off saves about 200 MB of RAM
    command: --performance-schema=OFF
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_TEST_DATABASE=ojt_test
      - TZ=Asia/Manila
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: flyway/flyway:13.9.0-alpine
    command: migrate
    environment:
      - FLYWAY_URL=jdbc:mysql://database:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true
      - FLYWAY_USER=${MYSQL_USER}
      - FLYWAY_PASSWORD=${MYSQL_PASSWORD}
      - FLYWAY_LOCATIONS=filesystem:/flyway/migrations,filesystem:/flyway/demo-data
    volumes:
      - ./db/migrations:/flyway/migrations:ro
      - ./db/demo-data:/flyway/demo-data:ro
    depends_on:
      database:
        condition: service_healthy

  # empties the test database and rebuilds it, so every test run starts from the same data.
  # only runs when asked: docker compose run --rm migrate-test
  migrate-test:
    image: flyway/flyway:13.9.0-alpine
    profiles: [test]
    command: -cleanDisabled=false clean migrate
    environment:
      - FLYWAY_URL=jdbc:mysql://database:3306/ojt_test?allowPublicKeyRetrieval=true
      - FLYWAY_USER=${MYSQL_USER}
      - FLYWAY_PASSWORD=${MYSQL_PASSWORD}
      - FLYWAY_LOCATIONS=filesystem:/flyway/migrations,filesystem:/flyway/demo-data
    volumes:
      - ./db/migrations:/flyway/migrations:ro
      - ./db/demo-data:/flyway/demo-data:ro
    depends_on:
      database:
        condition: service_healthy

  student-php:
    build:
      context: ./student
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_TEST_DATABASE=ojt_test
      - OIDC_PROVIDER_URL=http://sso:8080/realms/slu
      - OIDC_CLIENT_ID=ojt-portal
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET}
      - OIDC_REDIRECT_URI=http://localhost:8080/student/sso/callback
      - OIDC_LOGOUT_REDIRECT_URI=http://localhost:8080/student/login
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - student_uploads:/var/www/uploads
      - announcement_files:/var/www/announcement-files:ro

  nginx:
    image: nginx:1.27.5-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./assets:/usr/share/nginx/assets:ro
    depends_on:
      - adviser-node
      - student-php
  sso:
    image: quay.io/keycloak/keycloak:26.3.0
    command: start-dev --import-realm
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      - TZ=Asia/Manila
      - KC_HOSTNAME=http://localhost:8180
      - KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true
    volumes:
      - ./sso/slu-realm.json:/opt/keycloak/data/import/slu-realm.json:ro

volumes:
  db_data:
  student_uploads:
  announcement_files: # written by the adviser app, read-only for the student app
