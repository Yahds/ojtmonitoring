services:
  adviser-node:
    build:
      context: ./adviser
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - PORT=8080
      - SESSION_SECRET=${SESSION_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - student_uploads:/var/www/uploads:ro

  database:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: flyway/flyway:13.9.0-alpine
    command: migrate
    environment:
      - FLYWAY_URL=jdbc:mysql://database:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true
      - FLYWAY_USER=${MYSQL_USER}
      - FLYWAY_PASSWORD=${MYSQL_PASSWORD}
      - FLYWAY_LOCATIONS=filesystem:/flyway/migrations,filesystem:/flyway/demo-data
    volumes:
      - ./db/migrations:/flyway/migrations:ro
      - ./db/demo-data:/flyway/demo-data:ro
    depends_on:
      database:
        condition: service_healthy

  student-php:
    build:
      context: ./student
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MYSQL_HOST=database
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - student_uploads:/var/www/uploads

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - adviser-node
      - student-php

volumes:
  db_data:
  student_uploads:
