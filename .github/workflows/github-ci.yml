name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: adviser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: adviser/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ojt
          MYSQL_USER: ojt_app
          MYSQL_PASSWORD: ojt_app_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: ojt_app
      MYSQL_PASSWORD: ojt_app_ci
      MYSQL_DATABASE: ojt
      SESSION_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: adviser/package-lock.json
      - name: Load schema and seed
        run: |
          mysql -h 127.0.0.1 -u root -proot ojt < db/schema.sql
          mysql -h 127.0.0.1 -u root -proot ojt < db/seed.sql
      - name: Install deps
        working-directory: adviser
        run: npm ci
      - name: Run tests
        working-directory: adviser
        run: npm test
