server {
    listen 80;
    absolute_redirect off;

    location = /student {
        return 301 /student/;
    }

    location /student/ {
        proxy_pass http://student-php:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://adviser-node:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
