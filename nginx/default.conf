# only count login form submissions (POST), not people opening the login page
map $request_method $login_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $login_limit_key zone=adviser_logins:10m rate=60r/m;
limit_req_zone $login_limit_key zone=student_logins:10m rate=60r/m;

server {
    listen 80;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s;
    server_tokens off;

    # security headers for every response from both apps
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location = /adviser/login {
        limit_req zone=adviser_logins burst=20 nodelay;
        limit_req_status 429;
        set $adviser_app http://adviser-node:8080;
        proxy_pass $adviser_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /student/login {
        limit_req zone=student_logins burst=20 nodelay;
        limit_req_status 429;
        set $student_app http://student-php:80;
        rewrite ^ /login break;
        proxy_pass $student_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /student {
        return 301 /student/;
    }

    location /student/ {
        set $student_app http://student-php:80;
        rewrite ^/student/(.*)$ /$1 break;
        proxy_pass $student_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location /assets/ {
        alias /usr/share/nginx/assets/;
        expires 1h;
    }

    location / {
        set $adviser_app http://adviser-node:8080;
        proxy_pass $adviser_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
